[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flockrl-sim"
version = "0.1.0"
description = "Codebase for the FlockRL drone simulator."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "pandas>=2.0",
    "pydantic>=2.0",
    "gymnasium>=0.29",
    "pyyaml>=6.0",
    "simple-term-menu>=1.6.1",
    "dash>=2.14",
    "plotly>=5.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
rl = [
    "stable-baselines3[extra]>=2.2",
    "tensorboard>=2.0",
]

[tool.setuptools]
packages = {find = {}}

[tool.setuptools.package-data]
"flockrl_sim.environment" = ["specs/*.json"]
