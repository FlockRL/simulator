[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flockrl-sim"
version = "0.1.0"
description = "Skeleton codebase for the FlockRL drone simulator."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "numpy>=1.21",
    "pandas>=2.0",
    "pydantic>=2.0",
    "pyvista>=0.43",
    "simple-term-menu>=1.6.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
flockrl = "flockrl_sim.cli.main:cli"

[tool.setuptools]
packages = ["flockrl_sim"]
