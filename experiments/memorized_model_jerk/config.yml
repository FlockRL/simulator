# =============================================================================
# FlockRL Simulator Configuration
# =============================================================================
# This is the single source of truth for all training and evaluation settings.
# Each training run snapshots this file into experiments/<run_name>/config.yml.

# --- Environment ---
environment:
  spec: 3_obstacles
  seed: 42
  spawn_clearance: 2.0
  max_placement_attempts: 50

# --- Simulation ---
simulation:
  delta_t: 0.033333333333
  max_steps: 1000
  goal_threshold: 0.5
  max_acceleration: 5.0
  terminate_on_collision: true
  reset_position_noise: 0.0
  reset_velocity_noise: 0.0

# --- Collision ---
collision:
  drone_radius: 0.2
  restitution: 1.0

# --- Perception ---
perception:
  num_rays: 0
  max_range: 4.0
  max_neighbour_range: 0.0

# --- Gym Environment ---
gym:
  num_drones: 1
  max_neighbors: 0
  spawn_offset_range: 0.0
  save_runs: false

# --- Reward Function ---
reward:
  progress_scale: 25.0
  step_penalty: 0.05
  success_reward: 200.0
  collision_penalty: -200.0
  wall_collision_penalty: -200.0
  obstacle_collision_penalty: -200.0
  alive_bonus: 0.0
  jerk_penalty: 0.5

# --- Training ---
training:
  total_timesteps: 1_500_000
  num_envs: 16 # Decrease this for weaker machines. Try to match amount of CPU cores.
  checkpoint_freq: 10000
  ppo:
    learning_rate: 3.0e-4
    n_steps: 512
    batch_size: 2048 # 2^12, must be divisible by n_steps * num_envs
    n_epochs: 20
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.00
    vf_coef: 0.5
    max_grad_norm: 0.5
    log_std_init: -1.0
    ortho_init: false

# --- Visualization ---
visualization:
  fps: 60
  render_mode: offline
