# =============================================================================
# FlockRL Simulator Configuration (ROBUST SENSING & SMOOTH FLIGHT)
# =============================================================================

# --- Environment ---
environment:
  spec: rand_2_obstacles
  seed: null                         # Restored: Random seeds for robust learning
  spawn_clearance: 2.0
  max_placement_attempts: 50

# --- Simulation ---
simulation:
  delta_t: 0.033333333333
  max_steps: 1000
  goal_threshold: 0.5
  max_acceleration: 5.0
  terminate_on_collision: true
  reset_position_noise: 0.5          # Restored: Forces the drone to use sensors, not memory
  reset_velocity_noise: 0.1          # Restored

# --- Collision ---
collision:
  drone_radius: 0.2
  restitution: 1.0

# --- Perception ---
perception:
  num_rays: 16                       # Restored: The LIDAR is back online!
  max_range: 4.0
  max_neighbour_range: 0.0

# --- Gym Environment ---
gym:
  num_drones: 1
  max_neighbors: 0
  spawn_offset_range: 0.25           # Restored
  save_runs: false

# --- Reward Function ---
reward:
  progress_scale: 20.0               # Balanced to respect collision and jerk penalties
  step_penalty: 0.05                 
  success_reward: 200.0
  collision_penalty: -200.0          # High penalty for crashes
  wall_collision_penalty: -200.0
  obstacle_collision_penalty: -200.0
  alive_bonus: 0.0                   # Exploit fixed: Hovering strictly punished
  jerk_penalty: 0.5                  # NEW: Enforces smooth acceleration curves!

# --- Training ---
training:
  total_timesteps: 5_000_000         
  num_envs: 16                       # Assuming you are still on the 12th Gen i7
  checkpoint_freq: 10000
  ppo:
    learning_rate: 3.0e-4            # Fast learning rate
    n_steps: 1024
    batch_size: 2048 
    n_epochs: 10
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.2
    ent_coef: 0.05                   # Restored: Forces exploration to find the best path
    vf_coef: 0.5
    max_grad_norm: 0.5
    log_std_init: -1.0
    ortho_init: false

# --- Visualization ---
visualization:
  fps: 60
  render_mode: offline