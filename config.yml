# =============================================================================
# FlockRL Simulator Configuration
# =============================================================================
# This is the single source of truth for all training and evaluation settings.
# Each training run snapshots this file into experiments/<run_name>/config.yml.

# --- Environment ---
environment:
  spec: 2_obstacles
  seed: 42
  spawn_clearance: 2.0
  max_placement_attempts: 50

# --- Simulation ---
simulation:
  delta_t: 0.01666666666
  max_steps: 2000
  goal_threshold: 0.5
  max_acceleration: 5.0
  terminate_on_collision: true
  reset_position_noise: 0.0
  reset_velocity_noise: 0.0

# --- Collision ---
collision:
  drone_radius: 0.2
  restitution: 1.0

# --- Perception ---
perception:
  num_rays: 0
  max_range: 4.0
  max_neighbour_range: 0.0

# --- Gym Environment ---
gym:
  num_drones: 1
  max_neighbors: 0
  spawn_offset_range: 0.0
  save_runs: false

# --- Reward Function ---
reward:
  progress_scale: 60.0
  step_penalty: 0.04
  success_reward: 300.0
  collision_penalty: -80.0
  wall_collision_penalty: -80.0
  obstacle_collision_penalty: -80.0
  alive_bonus: 0.1
  smoothness_penalty: 0.1  # Penalize jerk (change in action) for sim-to-real; set e.g. 0.05–0.2 when fine-tuning

# --- Training ---
# For 2_obstacles, 1M steps gives ~0.8% success; 20M recommended for better convergence.
training:
  total_timesteps: 10_000_000
  num_envs: 8 # Decrease this for weaker machines
  checkpoint_freq: 10000
  ppo:
    learning_rate: 1.0e-4
    n_steps: 2048
    batch_size: 64
    n_epochs: 4
    gamma: 0.99
    gae_lambda: 0.95
    clip_range: 0.1
    ent_coef: 0.01  # Small exploration; 0.0 can collapse to repetitive collisions
    vf_coef: 0.5
    max_grad_norm: 0.5
    log_std_init: -1.0
    ortho_init: true

# --- Visualization ---
visualization:
  fps: 60
  render_mode: offline
